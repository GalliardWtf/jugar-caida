<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrando a Caída Club...</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 18px;
            display: inline-block;
            cursor: pointer;
            border: none;
            width: 80%;
            max-width: 300px;
        }
        .btn-secondary {
            background-color: #28a745;
        }
        .codigo-box {
            background-color: #333;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            
            /* --- EL FIX DE TAMAÑO ESTÁ AQUÍ --- */
            font-size: 14px; /* Tamaño más pequeño para que quepa */
            letter-spacing: 1px;
            font-weight: normal; /* Le quitamos la negrita excesiva */
            color: #ffcc00;
            word-break: break-all; /* Obliga al código largo a bajar de línea sin salirse */
            max-width: 80%; /* Evita que el cuadro toque los bordes del celular */
            box-sizing: border-box;
            /* ---------------------------------- */
        }
        .instrucciones {
            color: #ccc;
            margin-top: 15px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 16px;
        }
        .botones-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <h2 id="titulo">🚀 Preparando partida...</h2>

    <div id="contenido" style="display:none; width: 100%; display: flex; flex-direction: column; align-items: center;">
        <p class="instrucciones">Toca el botón azul para abrir el juego automáticamente.<br><br><b>¿Estás en iPhone o no abre?</b> Copia el código de abajo y pégalo en la sección "Unirse" dentro del juego.</p>
        
        <div class="codigo-box" id="textoCodigo">CÓDIGO</div>
        
        <div class="botones-container">
            <a id="botonEntrar" href="#" class="btn">🎮 Entrar a la Sala</a>
            <button id="botonCopiar" class="btn btn-secondary" onclick="copiarCodigo()">📋 Copiar Código</button>
        </div>
        <p id="mensajeCopiado" style="color: #28a745; display: none; font-weight: bold; margin-top: 15px;">¡Código copiado al portapapeles!</p>
    </div>

    <h2 id="errorMsj" style="display:none; color: #ff4c4c;">⚠️ Error: Enlace inválido</h2>

    <script>
        const params = new URLSearchParams(window.location.search);
        const lobbyId = params.get('lobby');
        const hostName = params.get('name');

        if (lobbyId) {
            document.getElementById("contenido").style.display = "flex";
            document.getElementById("textoCodigo").innerText = lobbyId;

            let deepLink = "caida://unirse?lobby=" + lobbyId;
            if (hostName) {
                deepLink += "&name=" + encodeURIComponent(hostName);
                document.getElementById("titulo").innerText = "🚀 " + hostName + " te invita a jugar...";
            }

            document.getElementById("botonEntrar").href = deepLink;

            setTimeout(function() {
                window.location.href = deepLink;
            }, 800);

        } else {
            document.getElementById("titulo").style.display = "none";
            document.getElementById("contenido").style.display = "none";
            document.getElementById("errorMsj").style.display = "block";
        }

        function copiarCodigo() {
            if(lobbyId) {
                navigator.clipboard.writeText(lobbyId).then(() => {
                    let msj = document.getElementById("mensajeCopiado");
                    msj.style.display = "block";
                    setTimeout(() => msj.style.display = "none", 3000);
                }).catch(err => {
                    alert("Error al copiar: " + err);
                });
            }
        }
    </script>
</body>
</html>
